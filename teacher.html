<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>교사 홈 | Learn Bridge</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout-body">
      <!-- 피그마 교사 플로우 진입 화면(요약 허브): 스케줄, 학습진행도, 출석, 수업자료, 복습, 과제, 공지, Q&A 등 -->
      <header class="site-header">
        <div class="header-inner">
          <div class="header-left">
            <h1 class="page-title">교사 로그인 화면</h1>
            <nav class="nav-main" aria-label="교사 메뉴">
              <a class="nav-link" href="#">셀프체크</a>
              <a class="nav-link" href="#">수업</a>
              <a class="nav-link" href="#">커뮤니티</a>
              <a class="nav-link" href="#">수업 이름</a>
            </nav>
          </div>
          <div class="header-right">
            <div class="profile-section">
              <button class="profile-btn">프로필</button>
              <a class="schedule-link" href="#">스케쥴</a>
            </div>
          </div>
        </div>
      </header>

      <main class="page-wrap">
        <div class="main-layout">
          <div class="content-area">
            <div class="promo-background">
              <h2>배경(수강자가 수강한 학원내의 수업 홍보/광고)</h2>
              <div class="promo-content">
                <p>수업 홍보 및 광고 영역</p>
              </div>
            </div>
          </div>
          
          <aside class="sidebar">
            <div class="ranking-section">
              <h3>진행도/이해도 랭킹</h3>
              <p class="ranking-desc">시험점수, 문제풀이 횟수</p>
              <p class="ranking-note">닉네임 (실명) 으로 보이게</p>
              <div class="ranking-list">
                <div class="ranking-item">
                  <span class="rank">1</span>
                  <span class="name">김학생 (김민준)</span>
                  <span class="score">95점</span>
                </div>
                <div class="ranking-item">
                  <span class="rank">2</span>
                  <span class="name">이학생 (이서아)</span>
                  <span class="score">92점</span>
                </div>
                <div class="ranking-item">
                  <span class="rank">3</span>
                  <span class="name">박학생 (박도윤)</span>
                  <span class="score">88점</span>
                </div>
              </div>
            </div>
            
            <div class="academy-link">
              <a href="#">학원 사이트 링크</a>
            </div>
          </aside>
        </div>
      </main>

      <footer class="site-footer"><p>© 2026 Learn Bridge · 교사 모드 데모</p></footer>
    </div>
    <script src="main.js"></script>
  </body>
</html>
