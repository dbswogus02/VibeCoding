<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 정보 입력 완료 화면 | Learn Bridge</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-body">
    <!-- 피그마: 회원가입 정보 입력 완료 화면 -->
    <div class="login-card card-reveal" style="max-width: 440px; text-align: center">
      <h1 style="margin: 0 0 12px; font-size: 1.4rem">회원가입 정보 입력 완료 화면</h1>
      <p class="lead" id="role-msg" style="margin-bottom: 24px">회원가입이 완료되었습니다!</p>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <a class="btn btn-primary" href="login.html" style="width: 100%; justify-content: center">학생 로그인</a>
        <a class="btn btn-ghost" href="login.html#teacher" style="width: 100%; justify-content: center">교사 로그인</a>
      </div>
    </div>
    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        var role = p.get("role");
        var el = document.getElementById("role-msg");
        if (el && role === "teacher") {
          el.textContent = "교사(강사) 계정은 관리자 승인 후 활성화될 수 있습니다. 승인 문자·메일을 확인해 주세요.";
        } else if (el && role === "student") {
          el.textContent = "학생 계정이 생성되었습니다. 로그인 후 수업·AI 피드백 메뉴를 이용해 보세요.";
        }
      })();
    </script>
    <script src="main.js"></script>
  </body>
</html>
